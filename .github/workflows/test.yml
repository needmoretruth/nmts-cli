# ⛔ IT REACTS TO `push` AND TO `pull_request` — never to `pull_request_target`. The difference is
#    the whole security story and it is one word wide: a `pull_request` run of a fork's branch gets
#    a READ-ONLY token and NO secrets, and GitHub holds a first-time contributor's run until a
#    maintainer approves it; `pull_request_target` runs that same stranger's code WITH this
#    repository's token. The publish gate refuses the second and every other externally startable
#    trigger — see deploy/lib/workflow-triggers.mjs in the source this file is exported from.
#
# ⚠ Outside code is merged here now, under the Contributor License Agreement. Accepting a patch
#    and running nothing on it would be worse than refusing patches, which is why this reacts to
#    pull requests at all.
#
# ⚠ Three operating systems because that is the claim the README makes. Plain JavaScript with no
#    native build step should run wherever Node runs, and "should" is not something a reader can
#    check — this is.
name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # ⛔ `dist/` IS IN THIS REPOSITORY, AND IT MUST BE THE ONE THIS SOURCE PRODUCES. It is here
      #    because installing straight from a repository cannot build: npm prepares a git
      #    dependency in a staging clone where the compiler is not available, and the install ends
      #    with `tsc: not found` (measured against this repository on npm 11.16.0). Committing the
      #    build is what makes `npm install -g github:…` work at all — and the price of committing
      #    a generated thing is that it can silently stop matching what generated it. This is that
      #    price, paid: build again and refuse if a single byte differs.
      - name: The committed build is the one this source produces
        shell: bash
        run: |
          set -euo pipefail
          mv dist dist-committed
          npm run compile
          diff -r dist-committed dist
          rm -rf dist-committed

      # ⛔ THE INSTALLED COMMAND, NOT THE ONE IN THIS DIRECTORY. Everything above runs the source
      #    from a checkout, and that is not how anybody else runs this. `npm install -g` does not
      #    copy the command onto the PATH — it puts a symlink there (a shim on Windows), and the
      #    program has to survive being reached that way. It did not: `nmts --version` printed
      #    NOTHING and exited 0 once installed, and so did every other command, because the file
      #    asked whether it was the program by comparing its own path against the one it was
      #    invoked as. Exit 0 with no output is the one failure an agent reads as success.
      #
      # ⚠ IT ALSO PROVES THE PACKAGE, not just the code: what `files` carries, whether the build
      #   ran, and whether the entry point is where `bin` says. A test suite cannot see any of it.
      - name: The installed command runs
        shell: bash
        run: |
          set -euo pipefail
          # ⛔ ASK npm FOR THE NAME; DO NOT GUESS IT. This was `./nmts-*.tgz`, and the day the
          #    package took a scoped name the glob stopped matching — npm flattens the scope into
          #    the filename, so the file became `needmoretruth-nmts-cli-<version>.tgz` and this
          #    step failed with ENOENT on a path containing a literal asterisk. `--silent` makes
          #    npm print the filename and nothing else.
          TARBALL="$(npm pack --silent | tail -1)"
          npm install -g "./$TARBALL"
          test -n "$(nmts --version)"
          nmts --version
          nmts env

  # ──────────────────────────────────────────────────────────────────────────────────────────────
  # ⛔ THE README SAYS THIS RUNS IN DOCKER AND PODMAN, ROOTLESS. That sentence was in it before
  #    anything built an image, and the `Dockerfile` beside it was three lines a reader had to copy
  #    correctly — the first version of which installed a symlink and produced a command that
  #    exited "executable file not found" from an image that built with no warning at all.
  #
  # ⚠ Both tools, not one. They differ in exactly the place this image cares about: who the process
  #   is, and who owns a volume mounted onto it.
  # ──────────────────────────────────────────────────────────────────────────────────────────────
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Docker builds it and the command runs
        run: |
          set -euo pipefail
          docker build -t nmts .
          test -n "$(docker run --rm nmts --version)"
          docker run --rm nmts env

      # ⛔ A VOLUME ON `/config`, BECAUSE THAT IS THE ONE THING AN IMAGE CAN GET WRONG SILENTLY.
      #    A named volume takes its owner from the directory already at that path in the image. If
      #    the image has no such directory the volume is created owned by root, the unprivileged
      #    user cannot write into it, and every upload fails on a machine where listing worked.
      - name: A mounted volume is writable by the user the image runs as
        run: |
          set -euo pipefail
          docker run --rm -v nmts-config:/config nmts consent grant spend
          # ⚠ NOT PIPED INTO `grep -q`. That closes the pipe on the first match, the container
          #   writing into it dies of a broken pipe, and `pipefail` turns a passing check into a
          #   failing step — intermittently, because it depends on which side finishes first.
          granted=$(docker run --rm -v nmts-config:/config nmts consent list)
          printf '%s\n' "$granted" | grep -q 'agreed *spend'

      - name: Podman builds it and the command runs, rootless
        run: |
          set -euo pipefail
          podman build -t nmts .
          test -n "$(podman run --rm nmts --version)"
          podman run --rm nmts env
