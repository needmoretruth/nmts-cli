# ⛔ IT REACTS TO `push` ONLY — never to `pull_request`. A workflow that runs on pull requests
#    executes a stranger's code with this repository's token, and this repository does not merge
#    outside code in any case: a merged patch would move part of the copyright to its author, and
#    the separate-licence offer in LICENSING.md can only be made by whoever holds all of it.
#
# ⚠ Three operating systems because that is the claim the README makes. Plain JavaScript with no
#    native build step should run wherever Node runs, and "should" is not something a reader can
#    check — this is.
name: test

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # ⛔ `dist/` IS IN THIS REPOSITORY, AND IT MUST BE THE ONE THIS SOURCE PRODUCES. It is here
      #    because installing straight from a repository cannot build: npm prepares a git
      #    dependency in a staging clone where the compiler is not available, and the install ends
      #    with `tsc: not found` (measured against this repository on npm 11.16.0). Committing the
      #    build is what makes `npm install -g github:…` work at all — and the price of committing
      #    a generated thing is that it can silently stop matching what generated it. This is that
      #    price, paid: build again and refuse if a single byte differs.
      - name: The committed build is the one this source produces
        shell: bash
        run: |
          set -euo pipefail
          mv dist dist-committed
          npm run build
          diff -r dist-committed dist
          rm -rf dist-committed

      # ⛔ THE INSTALLED COMMAND, NOT THE ONE IN THIS DIRECTORY. Everything above runs the source
      #    from a checkout, and that is not how anybody else runs this. `npm install -g` does not
      #    copy the command onto the PATH — it puts a symlink there (a shim on Windows), and the
      #    program has to survive being reached that way. It did not: `nmts --version` printed
      #    NOTHING and exited 0 once installed, and so did every other command, because the file
      #    asked whether it was the program by comparing its own path against the one it was
      #    invoked as. Exit 0 with no output is the one failure an agent reads as success.
      #
      # ⚠ IT ALSO PROVES THE PACKAGE, not just the code: what `files` carries, whether the build
      #   ran, and whether the entry point is where `bin` says. A test suite cannot see any of it.
      - name: The installed command runs
        shell: bash
        run: |
          set -euo pipefail
          npm pack
          npm install -g ./nmts-*.tgz
          test -n "$(nmts --version)"
          nmts --version
          nmts env
